# 用户 dsh Pod 的网络隔离（多租户加固）
#
# ingress 只放行网关 Pod → 3080：
# - 用户 Pod 之间互相不可达（横向隔离）
# - 集群内其他工作负载不可直达用户 dsh（唯一入口是带 CAS 会话的网关；
#   dsh 原生会话 cookie 只有网关持有，双保险）
# egress 不限：用户 dsh 需要访问 DeepSeek API / npm 等外部服务
#
# 注意：kind 默认 CNI（kindnet）不执行 NetworkPolicy——本清单在 kind 里
# 无害但不生效；生产集群（Calico/Cilium 等）会实际执行。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dsh-user-sandbox-ingress
  namespace: dsh-system
spec:
  podSelector:
    matchLabels:
      io.dsh.role: user-sandbox
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dsh-gateway
      ports:
        - protocol: TCP
          port: 3080
