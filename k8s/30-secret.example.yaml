# k8s/30-secret.yaml 样例（占位值，可安全提交）
#
# 正式文件由 gen-secret.sh 生成（含真实凭据，已被 .gitignore 排除）；
# 也可复制本文件为 30-secret.yaml 后手工填写。
#
# 键名都带 DSHGW_ 前缀（网关 envFrom 整体注入，pydantic-settings 按前缀读取）：
# - DSHGW_SESSION_SECRET_KEY：会话签名密钥，`openssl rand -hex 32`；重生成使所有
#   CAS 会话失效（不影响 dsh 沙盒内的用户数据）
# - DSHGW_DEEPSEEK_API_KEY：可选，DeepSeek 模型凭据，注入用户 Pod 作为默认
#   provider（dsh 原生环境变量 DEEPSEEK_API_KEY）；留空则用户在 dsh web UI
#   里自行配置模型（原生方式）。API Key 只进 Pod env，不落 PVC。
apiVersion: v1
kind: Secret
metadata:
  name: dsh-secrets
  namespace: dsh-system
type: Opaque
stringData:
  DSHGW_SESSION_SECRET_KEY: "change-me-openssl-rand-hex-32"
  DSHGW_DEEPSEEK_API_KEY: ""
